; SLiMS dev PHP config
display_errors = On
error_reporting = E_ALL
log_errors = On

memory_limit = 512M
upload_max_filesize = 25M
post_max_size = 25M
max_execution_time = 120

session.cookie_samesite = Lax
session.save_path = /tmp
open_basedir = /var/www/html/slims:/tmp:/usr/share/php:/usr/local/lib/php
